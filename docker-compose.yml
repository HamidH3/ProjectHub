# Runs ProjectHub in Docker on one machine.
#   1. npm run setup -- --for docker   (or copy .env.docker.example to .env.docker and fill it in)
#   2. docker compose --env-file .env.docker up -d --build
#   3. Open http://localhost:3000 (put HTTPS in front of it for real use; see docs/DEPLOY-DOCKER.md)
services:
  projecthub:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env.docker}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env.docker}
    image: projecthub:latest
    env_file: .env.docker
    ports:
      - "3000:3000"
    restart: unless-stopped
    # Locked down: no extra Linux permissions, files read-only except the cache.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
